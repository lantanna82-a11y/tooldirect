 <circle cx="57" cy="178" r="14" fill="var(--accent)"/><text x="57" y="183" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">1</text>
 <text x="48" y="220" font-size="13" font-weight="700">Два наружных диска</text>
 <text x="48" y="246" class="muted" font-size="11">Проверить параметры</text><path d="M178 218h16" fill="none" stroke="var(--line)" stroke-width="2"/><path d="m192 212 8 6-8 6" fill="none" stroke="var(--line)" stroke-width="2"/><rect x="200" y="150" width="148" height="136" rx="16" fill="var(--panel)" stroke="var(--border)"/>
 <circle cx="227" cy="178" r="14" fill="var(--accent)"/><text x="227" y="183" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">2</text>
 <text x="218" y="220" font-size="13" font-weight="700">Внутренние выгреб…</text>
 <text x="218" y="246" class="muted" font-size="11">Проверить параметры</text><path d="M348 218h16" fill="none" stroke="var(--line)" stroke-width="2"/><path d="m362 212 8 6-8 6" fill="none" stroke="var(--line)" stroke-width="2"/><rect x="370" y="150" width="148" height="136" rx="16" fill="var(--panel)" stroke="var(--border)"/>
 <circle cx="397" cy="178" r="14" fill="var(--accent)"/><text x="397" y="183" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">3</text>
 <text x="388" y="220" font-size="13" font-weight="700">Калиброванные шай…</text>
 <text x="388" y="246" class="muted" font-size="11">Проверить параметры</text>
</svg>