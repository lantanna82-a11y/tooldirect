<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title description">
 <title id="title">Диски для многопильных станков и пазовые наборы DADO</title>
 <desc id="description">Последовательность основных этапов, извлечённая из текста статьи.</desc>
 <style>:root{--bg:#f7f9fb;--panel:#fff;--text:#17232e;--muted:#687685;--line:#526d80;--accent:#315f86;--accent2:#a06b2f;--border:#d9e0e6}
 @media(prefers-color-scheme:dark){:root{--bg:#111a22;--panel:#18232d;--text:#edf2f5;--muted:#9aa8b4;--line:#8bb6d8;--accent:#78a8cc;--accent2:#d7a16b;--border:#30404c}}
 text{font-family:Arial,sans-serif;fill:var(--text)}.muted{fill:var(--muted)}.line{stroke:var(--line)}
 </style>
 <rect width="720" height="400" rx="24" fill="var(--bg)"/>
 <text x="36" y="48" font-size="20" font-weight="700">Диски для многопильных станков и пазовые наборы DADO</text>
